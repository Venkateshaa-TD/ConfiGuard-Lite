# Automated test suite. Deliberately tiny limits so fixtures stay small and
# tests stay fast - see tests/conftest.py for the generated fixtures.
project_name: configuard-lite
environment: testing
seed: 42
device: cpu
log_level: WARNING

validation:
  max_image_size_mb: 1
  max_video_size_mb: 5
  max_video_duration_seconds: 5
  allowed_image_extensions: [".jpg", ".jpeg", ".png", ".webp"]
  allowed_video_extensions: [".mp4", ".mov", ".mkv", ".avi"]

service:
  device: cpu
  max_concurrent_inference: 1
  max_queue: 1
  request_timeout_s: 20
  upload_timeout_s: 10
  cpu_threads_per_session: 1
  require_api_key: false
  gate_enabled: true
  docs_enabled: true
  ready_recheck_s: 0
  ui_enabled: true
  allow_explanations: true
  explain_occlusion_fallback: true   # occlusion hint only when Grad-CAM is withheld; explanation-only
  c2pa_enabled: false         # Content Credentials (read-only, offline, sandboxed worker)
  c2pa_timeout_s: 5
  c2pa_memory_mb: 512
  c2pa_max_file_mb: 50
