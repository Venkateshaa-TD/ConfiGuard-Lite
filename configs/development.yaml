# Local development on the laptop. Generous limits, verbose logging.
project_name: configuard-lite
environment: development
seed: 42
device: auto
log_level: DEBUG

validation:
  max_image_size_mb: 20
  max_video_size_mb: 200
  max_video_duration_seconds: 120
  allowed_image_extensions: [".jpg", ".jpeg", ".png", ".webp"]
  allowed_video_extensions: [".mp4", ".mov", ".mkv", ".avi"]

# Phase 10 inference service (paths/secrets come from .env, never here).
service:
  device: cpu                  # cpu (default) | cuda (optional; falls back to CPU if unavailable)
  max_concurrent_inference: 2
  max_queue: 8
  request_timeout_s: 120
  upload_timeout_s: 120
  cpu_threads_per_session: 0   # 0 = onnxruntime default
  require_api_key: false
  gate_enabled: true
  docs_enabled: true
  ready_recheck_s: 30
  ui_enabled: true             # local web UI at /
  allow_explanations: true     # still opt-in per request (explain=true)
  explain_occlusion_fallback: true   # occlusion hint only when Grad-CAM is withheld; explanation-only
  public_base_url: null          # e.g. https://your-domain.example; enables absolute og:url/og:image/canonical (env CONFIGUARD_PUBLIC_BASE_URL overrides)
  c2pa_enabled: true         # Content Credentials (read-only, offline, sandboxed worker)
  c2pa_timeout_s: 5
  c2pa_memory_mb: 512
  c2pa_max_file_mb: 50
