# Serving. Strict limits (defends the inference service against oversized
# or abusive uploads), quiet logging.
project_name: configuard-lite
environment: production
seed: 42
device: auto
log_level: WARNING

validation:
  max_image_size_mb: 15
  max_video_size_mb: 150
  max_video_duration_seconds: 90
  allowed_image_extensions: [".jpg", ".jpeg", ".png", ".webp"]
  allowed_video_extensions: [".mp4", ".mov", ".mkv", ".avi"]

# Phase 10 inference service. Auth is mandatory: the service refuses to
# start without service.require_api_key and CONFIGUARD_API_KEYS (fail closed).
service:
  device: cpu
  max_concurrent_inference: 2
  max_queue: 8
  request_timeout_s: 60
  upload_timeout_s: 60
  cpu_threads_per_session: 0
  require_api_key: true
  gate_enabled: true
  docs_enabled: false
  ready_recheck_s: 30
  ui_enabled: false            # the web UI is a local tool
  allow_explanations: false    # evidence hints are off unless explicitly enabled
  explain_occlusion_fallback: true   # occlusion hint only when Grad-CAM is withheld; explanation-only
  c2pa_enabled: true         # Content Credentials (read-only, offline, sandboxed worker)
  c2pa_timeout_s: 5
  c2pa_memory_mb: 512
  c2pa_max_file_mb: 50
