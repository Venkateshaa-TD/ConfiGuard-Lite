# Comparison baseline (CLAUDE.md: EfficientNet-B0). Batch 16 x accumulation
# 2 = effective batch 32, matching the MobileNetV4 config under 6 GB VRAM.
# Paths are intentionally blank: train/val manifests come from
# configuard.datasets (Phase 3) built over the user's own local dataset,
# and checkpoint/output dirs resolve from CONFIGUARD_CHECKPOINT_DIR /
# CONFIGUARD_OUTPUT_DIR in .env. Override per run, never commit real paths.
# Every key must be a TrainingConfig field - unknown keys are rejected.
encoder_name: efficientnet_b0
pretrained: true
seed: 42
run_name: efficientnet_b0

train_manifest: ""
val_manifest: ""
media_root: ""
frames_per_video: 8
batch_size: 16
num_workers: 0
balance_source: true
balance_class: true

epochs: 10
lr: 0.0003
weight_decay: 0.01
warmup_steps: 100
grad_accum_steps: 2
grad_clip_norm: 1.0
freeze_backbone: false
amp: true
amp_init_scale: 1024.0

early_stopping_patience: 3
selection_metric: val_auroc
log_every_n_steps: 10
device: auto
