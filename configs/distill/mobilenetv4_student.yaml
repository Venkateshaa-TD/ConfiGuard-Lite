# temperature and run_name may differ between them. Every key must be a
# DistillConfig field. Checkpoints go to CONFIGUARD_CHECKPOINT_DIR/distill.
run_name: student_baseline
alpha: 0.0
temperature: 1.0
seed: 42
encoder_name: mobilenetv4_conv_small
pretrained: true
crop_tag: p5d-b451b5ca770c8923
