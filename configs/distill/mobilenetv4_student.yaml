batch_size: 64
num_workers: 12           # train loader; val uses half
samples_per_epoch: 0        # 0 = one draw per train row (57,040)
max_epochs: 20
lr: 0.0003
weight_decay: 0.05
warmup_steps: 300
grad_clip_norm: 1.0
amp: true
