# Oracle Cloud Always Free (Ampere A1, arm64, 2 OCPU / 12 GB) override (Phase 15).
#
#   docker compose -f compose.yaml -f compose.oracle.yaml up -d
#
# compose.yaml keeps every hardening setting (read-only rootfs, cap drop, non-root, limits, secrets, tini).
# This file only adapts it to the 2-OCPU host and adds Caddy as the public TLS-terminating reverse proxy.
# CONFIGUARD_DOMAIN and ACME_EMAIL come from the .env file next to this file (written by
# scripts/prepare_oracle_bundle.py; not secret). The API key digest is secrets/api_keys.txt.

services:
  configuard:
    image: configuard-lite:1.0.0-rc.1-arm64
    pull_policy: never                 # the image is loaded from the bundle, never pulled or built here
    cpus: 2
    environment:
      CONFIGUARD_CPU_THREADS_PER_SESSION: "1"   # 2 OCPU / max_concurrent_inference (2)
      CONFIGUARD_PUBLIC_BASE_URL: https://${CONFIGUARD_DOMAIN:?set CONFIGUARD_DOMAIN in .env}

  caddy:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    depends_on:
      configuard:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]        # ports 80/443
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    environment:
      CONFIGUARD_DOMAIN: ${CONFIGUARD_DOMAIN:?set CONFIGUARD_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # TLS certificates (keep across restarts: Let's Encrypt rate limits)
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
  caddy_config:
